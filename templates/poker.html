<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🃏 Simple Poker</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f4c3a, #2d5a27);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .poker-table {
            background: #0a2f0a;
            border: 8px solid #8B4513;
            border-radius: 200px;
            padding: 40px;
            margin: 20px auto;
            position: relative;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .game-info {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 18px;
        }
        
        .cards {
            margin: 15px 0;
        }
        
        .card {
            display: inline-block;
            background: white;
            color: black;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px 8px;
            margin: 0 5px;
            font-weight: bold;
            font-size: 16px;
            min-width: 35px;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .card.hidden {
            background: #4169E1;
            color: white;
        }
        
        .red-suit {
            color: #DC143C !important;
        }
        
        .community-cards {
            margin: 20px 0;
        }
        
        .community-cards h3 {
            margin-bottom: 10px;
        }
        
        .player-section {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }
        
        .actions {
            margin: 20px 0;
        }
        
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #0056b3;
        }
        
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .btn-danger {
            background: #dc3545;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .btn-success {
            background: #28a745;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-warning {
            background: #ffc107;
            color: black;
        }
        
        .btn-warning:hover {
            background: #e0a800;
        }
        
        .message {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 16px;
            min-height: 20px;
        }
        
        .winner {
            background: rgba(40, 167, 69, 0.8) !important;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-box {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🃏 Simple Poker Game</h1>
            <button class="btn btn-success" onclick="newGame()">New Game</button>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Round</div>
                <div class="stat-value" id="round">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Pot</div>
                <div class="stat-value" id="pot">$0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Your Bankroll</div>
                <div class="stat-value" id="player-bankroll">$1000</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">AI Bankroll</div>
                <div class="stat-value" id="ai-bankroll">$1000</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Your Bet</div>
                <div class="stat-value" id="player-bet">$0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">To Call</div>
                <div class="stat-value" id="to-call">$0</div>
            </div>
        </div>
        
        <div class="poker-table">
            <div class="community-cards">
                <h3>Community Cards</h3>
                <div id="community-cards-display"></div>
            </div>
            
            <div class="player-section">
                <h3>🤖 AI Player</h3>
                <div id="ai-cards"></div>
            </div>
            
            <div class="player-section">
                <h3>👤 You</h3>
                <div id="player-cards"></div>
            </div>
        </div>
        
        <div class="message" id="message">Click "New Game" to start!</div>
        
        <div class="actions" id="actions">
            <button class="btn btn-danger" onclick="makeAction(0)" id="fold-btn">Fold</button>
            <button class="btn" onclick="makeAction(1)" id="check-btn" style="display:none;">Check</button>
            <button class="btn btn-warning" onclick="makeAction(2)" id="call-btn">Call $0</button>
            <button class="btn btn-success" onclick="makeAction(3)" id="bet-btn">Bet $50</button>
            <div style="margin: 10px 0;">
                <input type="number" id="custom-bet-amount" placeholder="Bet amount" min="1" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc; width: 120px;">
                <button class="btn btn-success" onclick="makeCustomBet()" id="custom-bet-btn">Custom Bet</button>
            </div>
        </div>
    </div>

    <script>
        let gameState = null;
        
        function isRedSuit(card) {
            return card.includes('♥') || card.includes('♦');
        }
        
        function renderCard(card, isHidden = false) {
            if (isHidden) {
                return '<span class="card hidden">??</span>';
            }
            
            const redClass = isRedSuit(card) ? 'red-suit' : '';
            return `<span class="card ${redClass}">${card}</span>`;
        }
        
        function updateDisplay() {
            if (!gameState) return;
            
            document.getElementById('round').textContent = gameState.round_name;
            document.getElementById('pot').textContent = '$' + gameState.pot;
            document.getElementById('player-bankroll').textContent = '$' + gameState.player_bankroll;
            document.getElementById('ai-bankroll').textContent = '$' + gameState.ai_bankroll;
            document.getElementById('player-bet').textContent = '$' + gameState.player_bet;
            document.getElementById('to-call').textContent = '$' + (gameState.to_call || 0);
            
            // Player cards
            document.getElementById('player-cards').innerHTML = 
                gameState.player_cards.map(card => renderCard(card)).join('');
            
            // AI cards (hidden unless game over)
            if (gameState.game_over) {
                document.getElementById('ai-cards').innerHTML = 
                    gameState.ai_cards.map(card => renderCard(card)).join('');
            } else {
                document.getElementById('ai-cards').innerHTML = 
                    renderCard('', true) + renderCard('', true);
            }
            
            // Community cards
            if (gameState.community_cards.length > 0) {
                document.getElementById('community-cards-display').innerHTML = 
                    gameState.community_cards.map(card => renderCard(card)).join('');
            } else {
                document.getElementById('community-cards-display').innerHTML = 
                    '<span style="opacity: 0.5;">No cards yet</span>';
            }
            
            // Message
            const messageEl = document.getElementById('message');
            messageEl.textContent = gameState.message;
            
            if (gameState.game_over) {
                messageEl.className = 'message winner';
            } else {
                messageEl.className = 'message';
            }
            
            // Action buttons - disable if not player's turn
            const actionButtons = document.querySelectorAll('#actions button, #actions input');
            const isPlayerTurn = gameState.player_turn && !gameState.game_over;
            actionButtons.forEach(btn => btn.disabled = !isPlayerTurn);
            
            // Update button text based on game state
            const callBtn = document.getElementById('call-btn');
            const checkBtn = document.getElementById('check-btn');
            const betBtn = document.getElementById('bet-btn');
            const customBetInput = document.getElementById('custom-bet-amount');
            const customBetBtn = document.getElementById('custom-bet-btn');
            
            if (gameState.can_check) {
                checkBtn.style.display = 'inline-block';
                callBtn.style.display = 'none';
            } else {
                checkBtn.style.display = 'none';
                callBtn.style.display = 'inline-block';
                callBtn.textContent = `Call $${gameState.to_call || 0}`;
            }
            
            // Update bet button
            const maxBet = Math.min(50, gameState.player_bankroll || 0);
            betBtn.textContent = `Bet $${maxBet}`;
            betBtn.disabled = !isPlayerTurn || maxBet <= 0;
            
            // Update custom bet
            customBetInput.max = gameState.player_bankroll || 0;
            customBetBtn.disabled = !isPlayerTurn || (gameState.player_bankroll || 0) <= 0;
            
            // Auto-trigger AI turn if it's not player's turn
            if (!gameState.player_turn && !gameState.game_over) {
                setTimeout(() => {
                    triggerAITurn();
                }, 1500); // Small delay for better UX
            }
        }
        
        async function newGame() {
            try {
                const response = await fetch('/api/new_game', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                
                gameState = await response.json();
                updateDisplay();
            } catch (error) {
                console.error('Error starting new game:', error);
                alert('Failed to start new game');
            }
        }
        
        async function makeAction(action) {
            if (!gameState || gameState.game_over || !gameState.player_turn) return;
            
            try {
                const response = await fetch('/api/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: action})
                });
                
                gameState = await response.json();
                updateDisplay();
            } catch (error) {
                console.error('Error making action:', error);
                alert('Failed to make action');
            }
        }
        
        async function makeCustomBet() {
            if (!gameState || gameState.game_over || !gameState.player_turn) return;
            
            const amount = parseInt(document.getElementById('custom-bet-amount').value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid bet amount');
                return;
            }
            
            try {
                const response = await fetch('/api/action', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 4, amount: amount}) // CUSTOM_BET = 4
                });
                
                gameState = await response.json();
                document.getElementById('custom-bet-amount').value = ''; // Clear input
                updateDisplay();
            } catch (error) {
                console.error('Error making custom bet:', error);
                alert('Failed to make custom bet');
            }
        }
        
        async function triggerAITurn() {
            if (!gameState || gameState.game_over || gameState.player_turn) return;
            
            try {
                const response = await fetch('/api/ai_turn', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                
                gameState = await response.json();
                updateDisplay();
            } catch (error) {
                console.error('Error with AI turn:', error);
            }
        }
        
        // Auto-start a game when page loads
        window.onload = function() {
            newGame();
        };
    </script>
</body>
</html>
